<script>
'use strict';
const gate = document.querySelector('#gate');
const deck = document.querySelector('#deck');
const form = document.querySelector('#unlock-form');
const input = document.querySelector('#passphrase');
const status = document.querySelector('#status');
const content = document.querySelector('#slides');
const previous = document.querySelector('#prev');
const next = document.querySelector('#next');
const fullscreen = document.querySelector('#fullscreen');
const payload = JSON.parse(document.querySelector('#encrypted-slides').textContent);
const decode = (value) => Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
let index = 0;
let slides = [];
function showSlide(position) {
  index = Math.min(Math.max(position, 0), slides.length - 1);
  slides.forEach((slide, number) => { slide.hidden = number !== index; });
  document.querySelector('#counter').textContent = (index + 1) + ' / ' + slides.length;
  previous.disabled = index === 0;
  next.disabled = index === slides.length - 1;
  slides[index].focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!window.crypto?.subtle) {
    status.textContent = '请在支持加密功能的浏览器中通过 HTTPS 打开此页。';
    return;
  }
  const submit = form.querySelector('button');
  submit.disabled = true;
  status.textContent = '正在解密…';
  const passphrase = new TextEncoder().encode(input.value);
  input.value = '';
  try {
    const material = await crypto.subtle.importKey('raw', passphrase, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: decode(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.ciphertext));
    content.innerHTML = new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
    slides = Array.from(content.querySelectorAll('.slide'));
    gate.hidden = true;
    deck.hidden = false;
    showSlide(0);
  } catch {
    status.textContent = '无法解锁，请检查密码后重试。';
    input.focus();
  } finally {
    passphrase.fill(0);
    submit.disabled = false;
  }
});
function lock() {
  if (deck.hidden) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  content.replaceChildren();
  slides = [];
  deck.hidden = true;
  gate.hidden = false;
  status.textContent = '';
  input.focus();
}
previous.addEventListener('click', () => showSlide(index - 1));
next.addEventListener('click', () => showSlide(index + 1));
document.querySelector('#lock').addEventListener('click', lock);
fullscreen.hidden = !document.fullscreenEnabled;
fullscreen.addEventListener('click', async () => {
  if (document.fullscreenElement) await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
});
document.addEventListener('fullscreenchange', () => {
  fullscreen.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
});
document.addEventListener('keydown', (event) => {
  if (deck.hidden || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  const directions = { ArrowRight: 1, ArrowLeft: -1, PageDown: 1, PageUp: -1 };
  const step = directions[event.key];
  if (!step) return;
  event.preventDefault();
  showSlide(index + step);
});
window.addEventListener('pagehide', lock);
</script>
</body>
