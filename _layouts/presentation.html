<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Presentation · Cyberseafaring</title>
<link rel="stylesheet" href="/presentation/vendor/reveal.css">
<link rel="stylesheet" href="/assets/css/port-impact-map.css">
<link rel="stylesheet" href="/presentation/deck.css">
</head>
<body>
<main class="gate" id="gate">
<nav><a href="/">中文主页</a><a href="/en/" lang="en">English home</a></nav>
<h1>Presentation</h1>
<p>请输入密码查看演示目录及报告。<br><span lang="en">Enter the password to view the presentation library.</span></p>
<form id="unlock-form">
<label for="passphrase">访问密码 / Password</label>
<input type="password" id="passphrase" autocomplete="current-password" required>
<button type="submit">解锁 / Unlock</button>
<p id="status" role="status"></p>
</form>
<noscript><p>请启用 JavaScript 解锁演示。 Enable JavaScript to unlock the presentation.</p></noscript>
</main>
<main class="gate library" id="library" hidden></main>
<main id="deck" hidden>
<nav class="toolbar" aria-label="演示控制">
<a id="library-link" data-presentation href="/presentation/">演示目录</a>
<button id="prev" type="button">上一页</button>
<output id="counter" aria-live="polite"></output>
<button id="next" type="button">下一页</button>
<button id="fullscreen" type="button">全屏</button>
<button id="lock" type="button">锁定</button>
<button id="language" type="button" lang="en">English</button>
</nav>
<div class="reveal" id="reveal"><div class="slides" id="slides"></div></div>
</main>
<script src="/presentation/vendor/reveal.js"></script>
<script src="/assets/js/port-impact-map.js"></script>
<script src="/presentation/deck.js"></script>
</body>
</html>
